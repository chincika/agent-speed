<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Task Score Prototype</title>
<link rel="stylesheet" href="task-score.css">
</head>
<body data-view="both">
<header class="pg-top">
  <h1>智力 v2 · 任務評分<small>DESIGN §12 的視覺參考：懸浮窗、選單列 / 工作列、排行看板、儀表板、評分卡、用量歷史</small></h1>
  <span class="spacer"></span>
  <div class="seg" role="group" aria-label="Language">
    <button data-lang="zh-Hant">繁中</button><button data-lang="zh-Hans">简中</button><button data-lang="en">EN</button><button data-lang="ja">日本語</button>
  </div>
  <div class="seg" role="group" aria-label="Theme">
    <button data-view="both">兩者並排</button><button data-view="dark">深色</button><button data-view="light">淺色</button>
  </div>
  <label class="pg-check"><input type="checkbox" id="reduce"> 減少動態</label>
  <button class="pg-btn" data-play="climb">上升示範</button>
  <button class="pg-btn" data-play="drop">下降示範</button>
  <button class="pg-btn" data-play="loop">打轉示範</button>
  <button class="pg-btn" data-play="reset">重設</button>
</header>
<main id="sections"></main>
<pre id="errors" aria-hidden="true" style="position:fixed;bottom:0;left:0;margin:0;color:#ff6b6b;font-size:11px"></pre>
<script src="strings.js"></script>
<script src="task-score-data.js"></script>
<script src="task-score-stats.js"></script>
<script src="task-score.js"></script>
</body>
</html>
